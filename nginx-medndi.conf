# Host nginx site for MedNdi (Let's Encrypt via certbot).
# Domain: medndi.com (and www). DNS A records for both must point at this server.
# 1. Copy and enable the site:
#    sudo cp nginx-medndi.conf /etc/nginx/sites-available/medndi
#    sudo ln -s /etc/nginx/sites-available/medndi /etc/nginx/sites-enabled/medndi
#    sudo nginx -t && sudo systemctl reload nginx
# 2. sudo certbot --nginx -d medndi.com -d www.medndi.com
#    (certbot adds the HTTPS listener, certificate paths and the http->https redirect)
#
# The MedNdi containers must listen on 127.0.0.1:8081 (APP_BIND / APP_PORT in .env).

server {
    listen 80;
    listen [::]:80;
    server_name medndi.com www.medndi.com;

    # Medical report PDFs can be up to 10 MB
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Report analysis can take a while
        proxy_read_timeout 120s;
    }
}
