# MedNdi: MongoDB + API + web app. Start everything with ./deploy.sh
# (or: docker compose up -d --build). Settings come from .env next to this file.

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 8080
      MONGO_DB_URL: mongodb://mongo:27017/medndi
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env (deploy.sh creates one)}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Browser and API share one origin through nginx, so Lax cookies work on http and https.
      # Set COOKIE_SECURE=true once the site is served over HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-Lax}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Requests arrive through nginx; trust it for the client IP and http/https scheme
      TRUST_PROXY: "1"
      # Transactional email (welcome, sign-in alert, booking and post-care confirmations)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      SITE_URL: ${SITE_URL:-https://medndi.com}
      CLOUD_NAME: ${CLOUD_NAME:-}
      CLOUD_API_KEY: ${CLOUD_API_KEY:-}
      CLOUD_API_SECRET: ${CLOUD_API_SECRET:-}
    volumes:
      - uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/hospitals"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BASE_URL: /api
    restart: unless-stopped
    ports:
      # Behind a host nginx (Let's Encrypt), set APP_BIND=127.0.0.1 and APP_PORT=8081 in .env
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo-data:
  uploads:
